name: docker-publish

# Build the production image of every app and push to GHCR:
#   push to main    -> mainnet flavor, tag = commit short-SHA (8 chars)
#   push to develop -> testnet flavor, tag = testnet-<short-SHA>
#
# All five apps are built on every push, even when only one changed. That is
# deliberate: the server-side auto-release pollers follow the branch head, so
# every head commit must have an image for every app — selective builds would
# let a poller skip an app whose image was never produced for the commit it is
# looking at. Actions minutes are free on a public repo; robustness wins.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: write   # comment the release command on the merged PR

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # app dir under apps/ -> package.json name (turbo --filter target)
          - { app: dex,         pkg: bze-dapp-v2 }
          - { app: burner,      pkg: bze-burner }
          - { app: staking,     pkg: bze-staking }
          - { app: factory,     pkg: bze-factory }
          - { app: communities, pkg: bze-communities }
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag and flavor
        id: vars
        # --short=8 pinned: the tag is always derivable from any commit listing.
        # develop builds get a testnet- prefix so the two flavors can never be
        # confused inside one GHCR package.
        run: |
          sha=$(git rev-parse --short=8 HEAD)
          if [ "${{ github.ref_name }}" = "develop" ]; then
            echo "flavor=testnet" >> "$GITHUB_OUTPUT"
            echo "tag=testnet-$sha" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=mainnet" >> "$GITHUB_OUTPUT"
            echo "tag=$sha" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          build-args: |
            APP=${{ matrix.app }}
            PKG=${{ matrix.pkg }}
            FLAVOR=${{ steps.vars.outputs.flavor }}
          tags: ghcr.io/${{ github.repository_owner }}/bze-dapp-${{ matrix.app }}:${{ steps.vars.outputs.tag }}

      - name: Summary
        run: echo "Pushed ghcr.io/${{ github.repository_owner }}/bze-dapp-${{ matrix.app }}:${{ steps.vars.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

      # dex only, so a merged PR gets ONE comment, not five. Runs after the
      # push succeeded, so the comment doubles as the "images are coming"
      # signal (mainnet releases are automatic via the server-side pollers).
      - name: Comment release info on the merged PR
        if: github.ref_name == 'main' && matrix.app == 'dex'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number')
          if [ -n "$pr" ] && [ "$pr" != "null" ]; then
            body="📦 Publishing \`ghcr.io/${{ github.repository_owner }}/bze-dapp-<app>:${TAG}\` for all apps.

          Auto-release deploys each app within minutes of its image landing. Manual deploy/rollback (from an app's deploy dir on the server):
          \`\`\`bash
          ./release.sh ${TAG}
          \`\`\`"
            gh pr comment "$pr" -R "${{ github.repository }}" --body "$body"
          else
            echo "no PR associated with ${{ github.sha }}, skipping comment"
          fi
