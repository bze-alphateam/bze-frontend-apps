name: docker-publish

# Build the production image of every CHANGED app, push it to GHCR, then
# deploy it:
#   push to main    -> mainnet flavor, tag = commit short-SHA (8 chars),
#                      deployed to <app>.getbze.com
#   push to develop -> testnet flavor, tag = testnet-<short-SHA>,
#                      deployed to testnet-<app>.getbze.com
#
# The build-time env (the NEXT_PUBLIC_* values inlined into a bundle) is NOT
# in this repo: every deploy target has a build.env in the private deploy repo
# (bze-alphateam/bze-deploy/<deploy dir>/build.env). Each job checks that dir
# out with the DEPLOY_REPO_TOKEN org secret and hands the file to `docker
# build` as a BuildKit secret — it never enters the build context, an image
# layer or the log. (This workflow runs on push and by hand only, so fork PRs
# never see the token. Do not add a pull_request trigger.)
#
# Which apps: the `changes` job (.github/scripts/changed-apps.sh) compares
# HEAD with the commit each app's target is actually running — the tag of its
# last successful deploy — not with the previous push, so a failed deploy, a
# queued run GitHub dropped or a force push never leaves an app behind. An app
# is built when turbo counts it as affected since then (a packages/ui-kit
# change affects all of them), and every app is built when anything else that
# goes into an image changed (Dockerfile, root package.json, pnpm-workspace,
# a new root file...) or when the lookup fails. An unchanged app gets no image
# for this commit; that is fine, a rollback picks a tag from the target's own
# release history.
#
# After a successful push each job dispatches the deploy repo's `deploy`
# workflow for its target and waits for it: a failed release on the server =
# red job here. A manual run builds the apps picked in its `apps` input
# (default all) and deploys them only when `deploy` is ticked — e.g. after a
# build.env change in the deploy repo, which no push here would pick up.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to build: all, or a comma-separated list of app dirs (dex,staking)"
        required: true
        default: all
        type: string
      deploy:
        description: "Also deploy them (to testnet from develop, mainnet from main)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

# Runs on one branch never overlap, so the `changes` job reads the live tags
# only after the previous run's deploys have finished.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_REPO: bze-alphateam/bze-deploy

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      # full history: the live commits are compared with HEAD
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # main = mainnet, develop = testnet; any other branch would release a
      # mainnet-flavored image of unreviewed code
      - name: Refuse a manual deploy from another branch
        if: inputs.deploy && github.ref_name != 'main' && github.ref_name != 'develop'
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::deploy is only allowed from main or develop, not $REF"
          exit 1

      - name: Pick the apps to build
        id: pick
        env:
          # app dir under apps/ : package.json name (turbo --filter target)
          APPS: >-
            dex:bze-dapp-v2
            burner:bze-burner
            staking:bze-staking
            factory:bze-factory
            communities:bze-communities
          FLAVOR: ${{ github.ref_name == 'develop' && 'testnet' || 'mainnet' }}
          ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apps || '' }}
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: .github/scripts/changed-apps.sh

  build-push:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag, flavor and deploy target
        id: vars
        # --short=8 pinned: the tag is always derivable from any commit listing.
        # develop builds get a testnet- prefix so the two flavors can never be
        # confused inside one GHCR package. deploy_dir = the target's directory
        # in the deploy repo = its ~/apps/<dir> on the server.
        run: |
          sha=$(git rev-parse --short=8 HEAD)
          if [ "${{ github.ref_name }}" = "develop" ]; then
            echo "flavor=testnet" >> "$GITHUB_OUTPUT"
            echo "tag=testnet-$sha" >> "$GITHUB_OUTPUT"
            echo "deploy_dir=testnet-${{ matrix.app }}.getbze.com" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=mainnet" >> "$GITHUB_OUTPUT"
            echo "tag=$sha" >> "$GITHUB_OUTPUT"
            echo "deploy_dir=${{ matrix.app }}.getbze.com" >> "$GITHUB_OUTPUT"
          fi

      # Sparse checkout of the one target dir, into deploy/ (excluded from the
      # docker build context by .dockerignore). The token is not persisted in
      # the checkout's git config.
      - name: Check out build env from the deploy repo
        uses: actions/checkout@v4
        with:
          repository: bze-alphateam/bze-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy
          sparse-checkout: ${{ steps.vars.outputs.deploy_dir }}
          persist-credentials: false

      - name: Check build env is present
        env:
          BUILD_ENV: deploy/${{ steps.vars.outputs.deploy_dir }}/build.env
        # presence and shape only — the file is never printed
        run: |
          if [ ! -s "$BUILD_ENV" ]; then
            echo "::error::$BUILD_ENV is missing or empty in the deploy repo"
            exit 1
          fi
          echo "using $BUILD_ENV ($(grep -c '^NEXT_PUBLIC_' "$BUILD_ENV") NEXT_PUBLIC_* values)"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          build-args: |
            APP=${{ matrix.app }}
            PKG=${{ matrix.pkg }}
          secret-files: |
            build_env=./deploy/${{ steps.vars.outputs.deploy_dir }}/build.env
          tags: ghcr.io/${{ github.repository_owner }}/bze-dapp-${{ matrix.app }}:${{ steps.vars.outputs.tag }}

      - name: Summary
        run: echo "Pushed ghcr.io/${{ github.repository_owner }}/bze-dapp-${{ matrix.app }}:${{ steps.vars.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

      # `gh workflow run` returns no run id, so the run is found by its title
      # (the deploy workflow sets run-name: deploy <app> <tag>) among the runs
      # created after this dispatch (minus a minute of clock skew). Waiting on
      # it makes a failed release on the server a red job here.
      - name: Deploy (dispatch the deploy repo's workflow and wait for it)
        # a manual run deploys only from the two deploy branches
        if: github.event_name == 'push' || (inputs.deploy && (github.ref_name == 'main' || github.ref_name == 'develop'))
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          APP: ${{ steps.vars.outputs.deploy_dir }}
          TAG: ${{ steps.vars.outputs.tag }}
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        run: |
          set -euo pipefail
          TITLE="deploy $APP $TAG"
          SINCE=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)
          export TITLE SINCE
          gh workflow run deploy.yml -R "$DEPLOY_REPO" -f app="$APP" -f tag="$TAG" -f source="$SOURCE" >/dev/null
          run_id=""
          for _ in $(seq 1 20); do
            sleep 5
            run_id=$(gh run list -R "$DEPLOY_REPO" --workflow deploy.yml -L 30 \
              --json databaseId,displayTitle,createdAt \
              --jq '[.[] | select(.displayTitle == env.TITLE and .createdAt >= env.SINCE)] | sort_by(.createdAt) | last | .databaseId // empty')
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "::error::dispatched '$TITLE' but no matching run appeared in the deploy repo within 100s"
            exit 1
          fi
          # This repo is public: its logs and summary must not carry the deploy repo's
          # run URL or step output, so the run is watched silently.
          if gh run watch "$run_id" -R "$DEPLOY_REPO" --interval 10 --exit-status >/dev/null 2>&1; then
            echo "✅ deploy \`$APP\` \`$TAG\` succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ deploy \`$APP\` \`$TAG\` FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::deploy of $APP $TAG failed, see the deploy repo's Actions (the previous tag stays live)"
            exit 1
          fi
