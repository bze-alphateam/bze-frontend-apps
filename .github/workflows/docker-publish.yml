name: docker-publish

# Build the production image of every app, push it to GHCR, then deploy it:
#   push to main    -> mainnet flavor, tag = commit short-SHA (8 chars),
#                      deployed to <app>.getbze.com
#   push to develop -> testnet flavor, tag = testnet-<short-SHA>,
#                      deployed to testnet-<app>.getbze.com
#
# The build-time env (the NEXT_PUBLIC_* values inlined into a bundle) is NOT
# in this repo: every deploy target has a build.env in the private deploy repo
# (bze-alphateam/bze-deploy/<deploy dir>/build.env). Each job checks that dir
# out with the DEPLOY_REPO_TOKEN org secret and hands the file to `docker
# build` as a BuildKit secret — it never enters the build context, an image
# layer or the log. (This workflow runs on push only, so fork PRs never see
# the token. Do not add a pull_request trigger.)
#
# After a successful push — on push events only; a workflow_dispatch build
# never deploys — each job dispatches the deploy repo's `deploy` workflow for
# its target and waits for it: a failed release on the server = red job here.
#
# All five apps are built on every push, even when only one changed. That is
# deliberate: every head commit gets a complete image set, so any commit on a
# deploy branch can be released or rolled back for every app. Actions minutes
# are free on a public repo; robustness wins.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:   # rebuild + push only, no deploy

permissions:
  contents: read
  packages: write
  pull-requests: write   # comment the deploy info on the merged PR

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOY_REPO: bze-alphateam/bze-deploy

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # app dir under apps/ -> package.json name (turbo --filter target)
          - { app: dex,         pkg: bze-dapp-v2 }
          - { app: burner,      pkg: bze-burner }
          - { app: staking,     pkg: bze-staking }
          - { app: factory,     pkg: bze-factory }
          - { app: communities, pkg: bze-communities }
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag, flavor and deploy target
        id: vars
        # --short=8 pinned: the tag is always derivable from any commit listing.
        # develop builds get a testnet- prefix so the two flavors can never be
        # confused inside one GHCR package. deploy_dir = the target's directory
        # in the deploy repo = its ~/apps/<dir> on the server.
        run: |
          sha=$(git rev-parse --short=8 HEAD)
          if [ "${{ github.ref_name }}" = "develop" ]; then
            echo "flavor=testnet" >> "$GITHUB_OUTPUT"
            echo "tag=testnet-$sha" >> "$GITHUB_OUTPUT"
            echo "deploy_dir=testnet-${{ matrix.app }}.getbze.com" >> "$GITHUB_OUTPUT"
          else
            echo "flavor=mainnet" >> "$GITHUB_OUTPUT"
            echo "tag=$sha" >> "$GITHUB_OUTPUT"
            echo "deploy_dir=${{ matrix.app }}.getbze.com" >> "$GITHUB_OUTPUT"
          fi

      # Sparse checkout of the one target dir, into deploy/ (excluded from the
      # docker build context by .dockerignore). The token is not persisted in
      # the checkout's git config.
      - name: Check out build env from the deploy repo
        uses: actions/checkout@v4
        with:
          repository: bze-alphateam/bze-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy
          sparse-checkout: ${{ steps.vars.outputs.deploy_dir }}
          persist-credentials: false

      - name: Check build env is present
        env:
          BUILD_ENV: deploy/${{ steps.vars.outputs.deploy_dir }}/build.env
        # presence and shape only — the file is never printed
        run: |
          if [ ! -s "$BUILD_ENV" ]; then
            echo "::error::$BUILD_ENV is missing or empty in the deploy repo"
            exit 1
          fi
          echo "using $BUILD_ENV ($(grep -c '^NEXT_PUBLIC_' "$BUILD_ENV") NEXT_PUBLIC_* values)"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod/Dockerfile
          push: true
          build-args: |
            APP=${{ matrix.app }}
            PKG=${{ matrix.pkg }}
          secret-files: |
            build_env=./deploy/${{ steps.vars.outputs.deploy_dir }}/build.env
          tags: ghcr.io/${{ github.repository_owner }}/bze-dapp-${{ matrix.app }}:${{ steps.vars.outputs.tag }}

      - name: Summary
        run: echo "Pushed ghcr.io/${{ github.repository_owner }}/bze-dapp-${{ matrix.app }}:${{ steps.vars.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

      # `gh workflow run` returns no run id, so the run is found by its title
      # (the deploy workflow sets run-name: deploy <app> <tag>) among the runs
      # created after this dispatch (minus a minute of clock skew). Waiting on
      # it makes a failed release on the server a red job here.
      - name: Deploy (dispatch the deploy repo's workflow and wait for it)
        if: github.event_name == 'push'
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          APP: ${{ steps.vars.outputs.deploy_dir }}
          TAG: ${{ steps.vars.outputs.tag }}
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        run: |
          set -euo pipefail
          TITLE="deploy $APP $TAG"
          SINCE=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)
          export TITLE SINCE
          gh workflow run deploy.yml -R "$DEPLOY_REPO" -f app="$APP" -f tag="$TAG" -f source="$SOURCE"
          run_id=""
          for _ in $(seq 1 20); do
            sleep 5
            run_id=$(gh run list -R "$DEPLOY_REPO" --workflow deploy.yml -L 30 \
              --json databaseId,displayTitle,createdAt \
              --jq '[.[] | select(.displayTitle == env.TITLE and .createdAt >= env.SINCE)] | sort_by(.createdAt) | last | .databaseId // empty')
            [ -n "$run_id" ] && break
          done
          if [ -z "$run_id" ]; then
            echo "::error::dispatched '$TITLE' but no matching run appeared in $DEPLOY_REPO within 100s"
            exit 1
          fi
          url="https://github.com/$DEPLOY_REPO/actions/runs/$run_id"
          echo "run_url=$url" >> "$GITHUB_OUTPUT"
          echo "Deploy run: $url"
          if gh run watch "$run_id" -R "$DEPLOY_REPO" --interval 10 --exit-status; then
            echo "✅ deploy \`$APP\` \`$TAG\`: $url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ deploy \`$APP\` \`$TAG\` FAILED: $url" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::deploy of $APP $TAG failed — see $url (the previous tag stays live)"
            exit 1
          fi

      # dex only, so a merged PR gets ONE comment, not five. Runs whether the
      # dex deploy passed or failed, never when the build/push itself failed.
      - name: Comment deploy info on the merged PR
        if: github.event_name == 'push' && github.ref_name == 'main' && matrix.app == 'dex' && !cancelled() && steps.deploy.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          DEPLOY_URL: ${{ steps.deploy.outputs.run_url }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number')
          if [ -n "$pr" ] && [ "$pr" != "null" ]; then
            body="📦 Published \`ghcr.io/${{ github.repository_owner }}/bze-dapp-<app>:${TAG}\` for all five apps.

          🚀 Deploys are push-based: each build job dispatched a \`deploy <app> ${TAG}\` run in the deploy repo and waited for it (a red deploy run = red build job). All runs: https://github.com/${DEPLOY_REPO}/actions/workflows/deploy.yml — dex: ${DEPLOY_URL:-not found} (${DEPLOY_OUTCOME}).

          Rollback / manual deploy: re-run that workflow with an older tag, or on the server from the app's deploy dir:
          \`\`\`bash
          ./release.sh ${TAG}
          \`\`\`"
            gh pr comment "$pr" -R "${{ github.repository }}" --body "$body"
          else
            echo "no PR associated with ${{ github.sha }}, skipping comment"
          fi
