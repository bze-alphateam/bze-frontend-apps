name: Deploy

# Triggered only after code lands on a protected branch (i.e. an already-CI-green,
# reviewed merge). SSHes into the server and asks it to run the deploy script.
# The server side is locked to a forced command (ci-deploy.sh), so this key can only
# ever request "deploy testnet" or "deploy mainnet" — never a shell.
on:
  push:
    branches: [develop, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never interrupt an in-flight deploy

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # main -> "production" (optionally gated by a required reviewer in the Environment
    # settings). develop -> "testnet" (no gate). Also scopes any environment secrets.
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'testnet' }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            TARGET="deploy mainnet"
          else
            TARGET="deploy testnet"
          fi
          echo "Requesting: $TARGET"
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "$TARGET"
